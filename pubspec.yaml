name: business_location_analyzer
description: BizSuggest - A Flutter app for business idea suggestions and community feedback with AI assistance.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=2.17.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  image_picker: ^1.0.4
  intl: ^0.18.1
  uuid: ^4.1.0
  fl_chart: ^0.64.0
  lottie: ^2.7.0
  animations: ^2.0.8
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
